{% assign canonical_url = page.url | replace: 'index.html', '' | absolute_url %}
{% assign meta_description = page.description | default: site.description | strip_html | normalize_whitespace %}
<link rel="canonical" href="{{ canonical_url | escape }}" />
<meta name="description" content="{{ meta_description | escape }}" />
<meta name="author" content="{{ site.author.name | escape }}" />
<meta property="og:site_name" content="{{ site.title | escape }}" />
<meta property="og:title" content="{% if page_title == '' or page_title == 'Home' %}{{ site.title | escape }}{% else %}{{ page_title | escape }}{% endif %}" />
<meta property="og:description" content="{{ meta_description | escape }}" />
<meta property="og:url" content="{{ canonical_url | escape }}" />
<meta property="og:type" content="website" />
{% if page.url == '/' or page.url == '/index.html' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": {{ site.title | jsonify }},
  "alternateName": "沈艺彬",
  "url": {{ '/' | absolute_url | jsonify }}
}
</script>
{% endif %}
